<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gradBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glowDot" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="soft"/>
      <feMerge><feMergeNode in="soft"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Left pillar -->
  <rect x="36" y="36" width="40" height="168" rx="14" fill="url(#gradBlue)" />

  <!-- Right pillar -->
  <rect x="244" y="36" width="40" height="168" rx="14" fill="url(#gradBlue)" />

  <!-- Solid diagonal connector -->
  <polygon points="76,36 108,36 244,204 212,204" fill="url(#gradPurple)" filter="url(#softGlow)" />

  <!-- Top-right dot -->
  <g filter="url(#glowDot)">
    <circle cx="284" cy="36" r="14" fill="#2ee6f0" />
  </g>

  <!-- subtle highlight lines -->
  <path d="M52 40 L52 196" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3" stroke-linecap="round" />
  <path d="M256 40 L256 196" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3" stroke-linecap="round" />
</svg>
